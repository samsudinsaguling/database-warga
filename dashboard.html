<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f4f6f9;
}

.sidebar{
width:250px;
height:100vh;
position:fixed;
background:#198754;
color:white;
padding:20px;
}

.sidebar a{
display:block;
padding:10px;
color:white;
text-decoration:none;
border-radius:5px;
margin-bottom:5px;
}

.sidebar a:hover{
background:#157347;
}

.content{
margin-left:270px;
padding:30px;
}

.card{
border:none;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<div class="sidebar">

<h3>CIWARU</h3>
<hr>

<a href="#">Dashboard</a>

<a href="#">Data KK</a>

</div>

<div class="content">

<div class="row">

<div class="col-md-3">
<div class="card p-3">
<h6>Jumlah Warga</h6>
<h2>0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h6>Jumlah KK</h6>
<h2>0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h6>Laki-laki</h6>

<div class="col-md-3">

</div>

</html>
