<script>

async function tampilData() {

const { data, error } = await supabase
  .from('DATA WARGA')
  .select('*');

if (error) {
    console.error(error);
    alert(
        "Kode Error : " + error.code +
        "\nPesan : " + error.message +
        "\nDetail : " + (error.details || "-")
    );
    return;
}

let html = '';

data.forEach((d, i) => {

html += `
<tr>
<td>${i + 1}</td>
<td>${d.NOMOR_NIK ?? ''}</td>
<td>${d.NOMOR_KK ?? ''}</td>
<td>${d.NAMA_LENGKAP ?? ''}</td>
<td>${d.JENIS_KELAMIN ?? ''}</td>
<td>${d.TEMPAT_LAHIR ?? ''}</td>
<td>${d.TANGGAL_LAHIR ?? ''}</td>
<td>${d.PENDIDIKAN ?? ''}</td>
<td>${d.PEKERJAAN ?? ''}</td>
</tr>
`;

});

document.getElementById("dataWarga").innerHTML = html;

if ($.fn.DataTable.isDataTable('#tabel')) {
    $('#tabel').DataTable().destroy();
}

$('#tabel').DataTable({
    pageLength: 25,
    responsive: true,
    language: {
        url: "https://cdn.datatables.net/plug-ins/1.13.8/i18n/id.json"
    }
});

}

tampilData();

async function tesKoneksi() {

const { data, error } = await supabase
  .from('DATA WARGA')
  .select('*')
  .limit(1);

if (error) {
    console.error(error);
    alert(
        "Kode Error : " + error.code +
        "\nPesan : " + error.message +
        "\nDetail : " + (error.details || "-")
    );
} else {
    alert("Koneksi berhasil!\nJumlah data terbaca: " + data.length);
    console.log(data);
}

}

</script>
