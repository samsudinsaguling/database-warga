<script>

async function tampilData() {

const { data, error } = await supabase
  .from('DATA WARGA')
  .select('*')
  .order('id', { ascending: true });

if (error) {
    console.log(error);
    alert(error.message);
    return;
}

let html = '';

data.forEach((d, i) => {

html += `
<tr>
<td>${i + 1}</td>
<td>${d.NOMOR_NIK ?? ''}</td>
<td>${d.NOMOR_KK ?? ''}</td>
<td>${d.NAMA_LENGKAP ?? ''}</td>
<td>${d.JENIS_KELAMIN ?? ''}</td>
<td>${d.TEMPAT_LAHIR ?? ''}</td>
<td>${d.TANGGAL_LAHIR ?? ''}</td>
<td>${d.PENDIDIKAN ?? ''}</td>
<td>${d.PEKERJAAN ?? ''}</td>
</tr>
`;

});

document.getElementById("dataWarga").innerHTML = html;

if ($.fn.DataTable.isDataTable('#tabel')) {
    $('#tabel').DataTable().destroy();
}

$('#tabel').DataTable({
    pageLength: 25,
    responsive: true
});

}

tampilData();

async function tesKoneksi() {

const { data, error } = await supabase
  .from('DATA WARGA')
  .select('*')
  .limit(1);

if (error) {
    alert(error.message);
    console.log(error);
} else {
    alert("Koneksi berhasil. Jumlah data terbaca: " + data.length);
    console.log(data);
}

}

</script>
